name: App update prerelease
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20.19'
          package-manager-cache: false
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e "import fs from 'node:fs'; if (process.env.RELEASE_TAG !== 'v' + JSON.parse(fs.readFileSync('package.json')).version) process.exit(1)"
      - run: npm test
      - run: python3 -m unittest discover -s appliance/tests -v
      - run: python3 tools/build-update.py
      - name: Publish development update
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" artifacts/update/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease
          --title "Foldback Server $RELEASE_TAG — development preview"
          --notes-file .github/RELEASE-NOTES.md
